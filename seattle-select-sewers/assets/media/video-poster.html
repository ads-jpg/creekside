<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seattle Select Sewers — branded video poster</title>
<!--
  Branded overlay for a job photo or video still. 1280x720 (16:9).

  TO USE: drop your own image in as .shot's background-image, below.
  Everything else (scrim, logo, labels, phone) sits on top of it.
    .shot { background-image: url("main-line-clearing.jpg"); }

  Render to PNG at 1280x720 with any headless browser screenshot tool.
-->
<style>
  @font-face {
    font-family: "Inter"; font-weight: 100 900; font-display: block;
    src: url("../fonts/inter-latin-var.woff2") format("woff2");
  }
  @font-face {
    font-family: "Oswald"; font-weight: 200 700; font-display: block;
    src: url("../fonts/oswald-latin-var.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #071722; }

  .poster { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; }

  /* ---- The photo. Replace the background-image with your own still. ---- */
  .shot {
    position: absolute; inset: 0;
    background: #2b3a45 center/cover no-repeat;
  }
  /* Placeholder marking — delete this rule once a real photo is in. */
  .shot--empty {
    background:
      repeating-linear-gradient(45deg, #32424e 0 22px, #2b3a45 22px 44px);
    display: grid; place-items: center;
  }
  .shot--empty span {
    font: 700 20px/1.5 "Inter", sans-serif; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(255,255,255,.42); text-align: center;
  }

  /* ---- Scrims: keep type legible over any photo ---- */
  .scrim-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
    background: linear-gradient(to top, rgba(7,23,34,.94) 0%, rgba(7,23,34,.78) 34%, rgba(7,23,34,0) 100%);
  }
  .scrim-top {
    position: absolute; left: 0; right: 0; top: 0; height: 26%;
    background: linear-gradient(to bottom, rgba(7,23,34,.72), rgba(7,23,34,0));
  }

  /* ---- Top-left status badge ---- */
  .badge {
    position: absolute; top: 34px; left: 40px;
    display: inline-flex; align-items: center; gap: 10px;
    background: #1550b8; color: #fff; padding: 10px 18px; border-radius: 6px;
    font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 600;
    font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
  }
  .badge i { width: 10px; height: 10px; border-radius: 50%; background: #fff; }

  /* ---- Bottom block ---- */
  .foot { position: absolute; left: 40px; right: 40px; bottom: 36px; }
  .job {
    font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 700;
    text-transform: uppercase; color: #fff; line-height: .98;
    font-size: 62px; letter-spacing: 0; margin-bottom: 10px;
  }
  .sub { color: #8fd4e4; font-size: 21px; font-weight: 600; margin-bottom: 26px; }

  .bar { display: flex; align-items: center; gap: 26px; }
  .bar img { width: 150px; height: auto; display: block; }
  .rule { width: 1px; align-self: stretch; background: rgba(255,255,255,.28); }
  .meta { color: #b6ccda; font-size: 15px; line-height: 1.5; }
  .meta strong { display: block; color: #fff; font-size: 16px; }

  .phone {
    margin-left: auto; display: inline-flex; align-items: center; gap: 12px;
    background: #1550b8; color: #fff; padding: 15px 26px; border-radius: 9px;
    font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 600;
    font-size: 31px; letter-spacing: .01em; white-space: nowrap;
  }
  .phone svg { width: 27px; height: 27px; }
</style>
</head>
<body>
<div class="poster">
  <div class="shot shot--empty"><span>Your job photo<br>or video still</span></div>

  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <div class="badge"><i></i>Main line service call</div>

  <div class="foot">
    <div class="job">Main Line Drain Clearing</div>
    <div class="sub">Seattle · King, Snohomish &amp; Pierce counties</div>

    <div class="bar">
      <img src="../img/logo.svg" alt="Seattle Select Sewers">
      <div class="rule"></div>
      <div class="meta">
        <strong>Licensed, bonded &amp; insured</strong>
        WA L&amp;I #SEATTSS874JJ · Serving Puget Sound since 2005
      </div>
      <div class="phone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        (425) 531-4847
      </div>
    </div>
  </div>
</div>
</body>
</html>

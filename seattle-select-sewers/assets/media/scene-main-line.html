<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main line clearing — illustrated scene</title>
<!-- Original flat illustration: drain tech clearing a main line at the cleanout,
     branded van at the curb behind. 1280x720. No photographic source.
     Draw order runs back to front: sky, buildings, trees, street, VAN,
     curb, sidewalk, grass, then the foreground figure and machine. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #eef6fa; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e0ed"/><stop offset="100%" stop-color="#eaf4f8"/>
    </linearGradient>
    <linearGradient id="vanBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f3f8fa"/><stop offset="100%" stop-color="#dae7ee"/>
    </linearGradient>
    <clipPath id="drumClip"><circle cx="786" cy="560" r="70"/></clipPath>
  </defs>

  <!-- ===== Sky ===== -->
  <rect width="1280" height="310" fill="url(#sky)"/>

  <!-- ===== Buildings ===== -->
  <g fill="#bdd2de">
    <rect x="-10" y="128" width="236" height="184"/><rect x="1006" y="106" width="294" height="206"/>
  </g>
  <g fill="#aac4d2">
    <rect x="214" y="162" width="150" height="150"/><rect x="884" y="146" width="134" height="166"/>
  </g>
  <g fill="#95b4c6" opacity=".5">
    <rect x="24" y="158" width="30" height="38" rx="3"/><rect x="80" y="158" width="30" height="38" rx="3"/>
    <rect x="24" y="218" width="30" height="38" rx="3"/><rect x="80" y="218" width="30" height="38" rx="3"/>
    <rect x="1044" y="140" width="34" height="42" rx="3"/><rect x="1110" y="140" width="34" height="42" rx="3"/>
    <rect x="1176" y="140" width="34" height="42" rx="3"/>
    <rect x="1044" y="208" width="34" height="42" rx="3"/><rect x="1110" y="208" width="34" height="42" rx="3"/>
    <rect x="1176" y="208" width="34" height="42" rx="3"/>
  </g>

  <!-- ===== Trees ===== -->
  <g>
    <rect x="112" y="206" width="18" height="112" rx="5" fill="#6d5a49"/>
    <circle cx="121" cy="168" r="74" fill="#4f8f6b"/><circle cx="74" cy="200" r="46" fill="#457f5f"/>
    <circle cx="170" cy="196" r="50" fill="#58996f"/>
  </g>
  <g>
    <rect x="1146" y="214" width="16" height="104" rx="5" fill="#6d5a49"/>
    <circle cx="1154" cy="180" r="62" fill="#4a8765"/><circle cx="1202" cy="206" r="42" fill="#417a5b"/>
    <circle cx="1108" cy="206" r="44" fill="#54946c"/>
  </g>

  <!-- ===== Street ===== -->
  <rect x="0" y="310" width="1280" height="92" fill="#92a7b4"/>
  <rect x="0" y="310" width="1280" height="5" fill="#8195a2"/>

  <!-- ===== Van (white, branded) — sits on the street, behind the curb ===== -->
  <g>
    <ellipse cx="640" cy="392" rx="332" ry="12" fill="#6d8391" opacity=".4"/>
    <path d="M318 384 L313 226 Q313 209 329 199 L398 160 Q409 155 421 155 L948 155 Q970 155 970 176 L970 366 Q970 384 952 384 Z"
          fill="url(#vanBody)" stroke="#c0d1db" stroke-width="3"/>
    <path d="M330 224 L396 182 Q403 178 412 178 L436 178 L436 232 Q436 239 429 239 L335 239 Q326 239 330 224 Z" fill="#33566a"/>
    <path d="M456 178 L532 178 Q541 178 541 187 L541 232 Q541 239 532 239 L456 239 Z" fill="#3c6178"/>
    <path d="M560 166 v208" stroke="#d3e0e7" stroke-width="3"/>
    <path d="M866 166 v208" stroke="#d3e0e7" stroke-width="3"/>
    <image href="../img/logo.svg" x="596" y="196" width="214" height="134"/>
    <rect x="313" y="338" width="657" height="10" fill="#d8e4eb"/>
    <text x="703" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="1" fill="#123448">(425) 531-4847</text>
    <rect x="315" y="256" width="15" height="24" rx="6" fill="#e8c94f"/>
    <circle cx="424" cy="384" r="46" fill="#e6eff3"/><circle cx="866" cy="384" r="46" fill="#e6eff3"/>
    <circle cx="424" cy="384" r="39" fill="#2b333a"/><circle cx="866" cy="384" r="39" fill="#2b333a"/>
    <circle cx="424" cy="384" r="17" fill="#9fb0ba"/><circle cx="866" cy="384" r="17" fill="#9fb0ba"/>
  </g>

  <!-- ===== Curb, sidewalk, grass — drawn over the van's wheels for depth ===== -->
  <rect x="0" y="398" width="1280" height="20" fill="#cbd8df"/>
  <rect x="0" y="416" width="1280" height="60" fill="#dee8ed"/>
  <g stroke="#cbd7de" stroke-width="3"><path d="M236 416v60M628 416v60M1012 416v60"/></g>
  <rect x="0" y="472" width="1280" height="248" fill="#79ac60"/>
  <rect x="0" y="472" width="1280" height="9" fill="#6b9e54"/>
  <g fill="#6b9e54" opacity=".55">
    <path d="M72 560q7-20 14 0zM196 648q7-22 14 0zM1032 556q7-20 14 0zM1156 664q7-22 14 0zM940 700q7-20 14 0zM330 700q7-20 14 0z"/>
  </g>

  <!-- ===== Cleanout ===== -->
  <g>
    <ellipse cx="556" cy="656" rx="54" ry="15" fill="#6b9e54"/>
    <path d="M528 654 h56 v-62 h-56 z" fill="#cfd9e0"/>
    <path d="M528 654 h18 v-62 h-18 z" fill="#e6edf1"/>
    <path d="M524 596 h64 v-13 h-64 z" fill="#eef3f6"/>
    <ellipse cx="556" cy="583" rx="32" ry="11" fill="#f4f8fa" stroke="#b7c6d0" stroke-width="2"/>
    <ellipse cx="556" cy="584" rx="19" ry="6.5" fill="#1f2c35"/>
    <!-- cap, unthreaded and set in the grass -->
    <ellipse cx="466" cy="668" rx="27" ry="10" fill="#aebdc7"/>
    <ellipse cx="466" cy="662" rx="27" ry="10" fill="#dde6eb"/>
    <ellipse cx="466" cy="662" rx="14" ry="5" fill="#c3cfd8"/>
  </g>

  <!-- ===== Drum machine ===== -->
  <g>
    <ellipse cx="788" cy="666" rx="120" ry="17" fill="#5f9049" opacity=".5"/>
    <!-- upright frame -->
    <path d="M708 648 L718 470 h24 L732 648 z" fill="#d8342a"/>
    <path d="M868 648 L858 470 h-24 L844 648 z" fill="#bf2b22"/>
    <rect x="700" y="628" width="176" height="19" rx="9.5" fill="#bf2b22"/>
    <!-- push handle, upright -->
    <rect x="712" y="452" width="152" height="19" rx="9.5" fill="#d8342a"/>
    <rect x="726" y="432" width="124" height="15" rx="7.5" fill="#25323b"/>
    <!-- drum -->
    <circle cx="786" cy="560" r="70" fill="#2f7d4f"/>
    <g clip-path="url(#drumClip)">
      <circle cx="786" cy="560" r="55" fill="none" stroke="#276a43" stroke-width="11"/>
      <circle cx="786" cy="560" r="35" fill="none" stroke="#276a43" stroke-width="9"/>
    </g>
    <circle cx="786" cy="560" r="70" fill="none" stroke="#245f3c" stroke-width="4"/>
    <circle cx="786" cy="560" r="15" fill="#d3dde3"/>
    <!-- coiled hose hung on the frame -->
    <g fill="none" stroke="#efc04a" stroke-width="11" stroke-linecap="round">
      <path d="M736 500 q50-30 100-2"/><path d="M742 484 q46-28 92-2"/>
    </g>
    <!-- wheels -->
    <circle cx="724" cy="650" r="29" fill="#25323b"/><circle cx="724" cy="650" r="11" fill="#8c9aa4"/>
    <circle cx="852" cy="650" r="29" fill="#25323b"/><circle cx="852" cy="650" r="11" fill="#8c9aa4"/>
    <!-- cable paying out into the cleanout -->
    <path d="M718 582 Q652 616 596 600 Q572 594 560 584" fill="none" stroke="#96a5b0" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ===== Technician, orange uniform ===== -->
  <g>
    <ellipse cx="400" cy="672" rx="116" ry="17" fill="#5f9049" opacity=".5"/>

    <!-- trailing leg, knee to the ground -->
    <path d="M364 598 L318 646" stroke="#2c3e4c" stroke-width="44" stroke-linecap="round" fill="none"/>
    <path d="M318 646 L272 656" stroke="#3a3129" stroke-width="32" stroke-linecap="round" fill="none"/>
    <!-- planted leg -->
    <path d="M384 596 L454 622" stroke="#33485a" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M454 622 L462 660" stroke="#33485a" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M462 662 L504 670" stroke="#3a3129" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- far arm, behind the torso -->
    <path d="M398 530 L466 566" stroke="#c25f0b" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M466 566 L520 592" stroke="#c25f0b" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="530" cy="596" r="17" fill="#b9c7d0"/>

    <!-- torso -->
    <path d="M396 516 L378 590" stroke="#f07f1a" stroke-width="78" stroke-linecap="round" fill="none"/>
    <path d="M366 540 L352 588" stroke="#d96a0f" stroke-width="20" stroke-linecap="round" fill="none" opacity=".5"/>
    <!-- hi-vis stripe across the back -->
    <path d="M362 556 L414 566" stroke="#f6d97a" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- head, turned down to the work -->
    <circle cx="394" cy="470" r="32" fill="#d9a179"/>
    <path d="M420 462 a30 30 0 0 0-56-6 z" fill="#123448"/>
    <path d="M418 456 q22 2 26 10 l-28 2 z" fill="#123448"/>
    <path d="M376 500 q20 15 38 1 l-5 15 q-15 10-28 0 z" fill="#d96a0f"/>

    <!-- near arm, gloved hand feeding the cable -->
    <path d="M408 530 L474 556" stroke="#f07f1a" stroke-width="33" stroke-linecap="round" fill="none"/>
    <path d="M474 556 L528 576" stroke="#f07f1a" stroke-width="29" stroke-linecap="round" fill="none"/>
    <circle cx="540" cy="579" r="18" fill="#dfe8ed"/>
  </g>
</svg>
</body>
</html>

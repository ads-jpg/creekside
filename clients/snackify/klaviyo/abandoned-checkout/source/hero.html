<!doctype html>
<!-- Source for images/hero.png. Rendered at 1200x720 (shown at 600x360 in the email). Re-render: node render.js -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --lime: #AEDE1D; --green: #008059; --teal: #4DD0BA; --coral: #FF8075;
    --mint: #77D3A6; --orange: #F1AF40; --charcoal: #58595B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 720px; overflow: hidden; }
  body { background: var(--green); position: relative; font-family: 'Montserrat', sans-serif; }
  .art { position: absolute; inset: 0; }
  .copy { position: absolute; left: 84px; top: 112px; width: 540px; }
  .eyebrow {
    display: inline-block; background: var(--lime); color: var(--green);
    font-weight: 700; font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px;
  }
  h1 {
    font-family: 'Roboto Slab', serif; font-weight: 800; color: #FFFFFF;
    font-size: 92px; line-height: 1.0; letter-spacing: -1.5px; margin-top: 34px;
  }
  h1 .hl { color: var(--lime); position: relative; white-space: nowrap; }
  h1 .hl svg { position: absolute; left: 0; bottom: -26px; width: 100%; height: 30px; }
  .sub { color: #FFFFFF; opacity: .92; font-size: 30px; font-weight: 500; margin-top: 58px; line-height: 1.35; }
</style>
</head>
<body>
<svg class="art" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <!-- background tint shapes (brand green tints) -->
  <circle cx="930" cy="400" r="330" fill="#339980" opacity=".55"/>
  <circle cx="930" cy="400" r="240" fill="#66B39B" opacity=".35"/>
  <circle cx="60" cy="700" r="140" fill="#339980" opacity=".45"/>

  <!-- confetti -->
  <g>
    <circle cx="640" cy="96" r="11" fill="#F1AF40"/>
    <circle cx="1140" cy="140" r="9" fill="#FF8075"/>
    <circle cx="1120" cy="610" r="12" fill="#4DD0BA"/>
    <circle cx="660" cy="640" r="8" fill="#AEDE1D"/>
    <rect x="1080" y="70" width="26" height="10" rx="5" fill="#77D3A6" transform="rotate(35 1093 75)"/>
    <rect x="700" y="560" width="26" height="10" rx="5" fill="#F1AF40" transform="rotate(-25 713 565)"/>
    <rect x="1160" y="380" width="26" height="10" rx="5" fill="#AEDE1D" transform="rotate(70 1173 385)"/>
    <!-- sparkles -->
    <path d="M1010 70 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#AEDE1D"/>
    <path d="M700 250 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#FFFFFF"/>
    <path d="M1150 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#FFFFFF"/>
  </g>

  <!-- snacks peeking out of the cart (drawn before the basket so it overlaps them) -->
  <!-- chip bag -->
  <g transform="rotate(-12 830 260)">
    <path d="M760 150 l12 -14 12 14 12 -14 12 14 12 -14 12 14 12 -14 12 14 12 -14 12 14 12 -14 V360 H760z" fill="#FF8075"/>
    <rect x="760" y="168" width="144" height="14" fill="#E86A60"/>
    <circle cx="832" cy="262" r="42" fill="#AEDE1D"/>
    <path d="M812 262 q20 -30 40 0 q-20 30 -40 0z" fill="#008059"/>
  </g>
  <!-- snack bar -->
  <g transform="rotate(14 935 250)">
    <rect x="895" y="150" width="84" height="220" rx="12" fill="#4DD0BA"/>
    <rect x="895" y="150" width="84" height="26" rx="12" fill="#3AB9A4"/>
    <rect x="895" y="226" width="84" height="44" fill="#FFFFFF" opacity=".9"/>
    <rect x="910" y="241" width="54" height="14" rx="7" fill="#008059"/>
  </g>
  <!-- cookie -->
  <g>
    <circle cx="1030" cy="262" r="74" fill="#F1AF40"/>
    <circle cx="1030" cy="262" r="74" fill="none" stroke="#D9952B" stroke-width="8"/>
    <circle cx="1002" cy="232" r="11" fill="#58595B"/>
    <circle cx="1052" cy="240" r="9" fill="#58595B"/>
    <circle cx="1030" cy="286" r="12" fill="#58595B"/>
    <circle cx="992" cy="290" r="8" fill="#58595B"/>
    <circle cx="1068" cy="296" r="8" fill="#58595B"/>
  </g>

  <!-- cart -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- handle -->
    <path d="M660 214 H716 L770 520 H1060" stroke-width="18"/>
  </g>
  <!-- basket -->
  <path d="M728 300 H1120 L1076 510 H772z" fill="#FFFFFF"/>
  <g stroke="#AEDE1D" stroke-width="10" stroke-linecap="round">
    <line x1="800" y1="340" x2="1092" y2="340"/>
    <line x1="808" y1="400" x2="1080" y2="400"/>
    <line x1="818" y1="460" x2="1066" y2="460"/>
  </g>
  <g stroke="#E4F6ED" stroke-width="10" stroke-linecap="round">
    <line x1="850" y1="318" x2="862" y2="492"/>
    <line x1="924" y1="318" x2="928" y2="492"/>
    <line x1="998" y1="318" x2="994" y2="492"/>
    <line x1="1070" y1="318" x2="1058" y2="492"/>
  </g>
  <!-- wheels -->
  <circle cx="812" cy="588" r="34" fill="#FFFFFF"/>
  <circle cx="812" cy="588" r="13" fill="#008059"/>
  <circle cx="1024" cy="588" r="34" fill="#FFFFFF"/>
  <circle cx="1024" cy="588" r="13" fill="#008059"/>
</svg>

<div class="copy">
  <div class="eyebrow">Psst&hellip; you forgot something</div>
  <h1>Your snacks are still <span class="hl">waiting.<svg viewBox="0 0 300 30" preserveAspectRatio="none"><path d="M4 18 Q 40 4 76 16 T 150 16 T 224 16 T 296 12" fill="none" stroke="#FF8075" stroke-width="8" stroke-linecap="round"/></svg></span></h1>
  <p class="sub">We saved your cart. Finish up before your favorites sell out.</p>
</div>
</body>
</html>

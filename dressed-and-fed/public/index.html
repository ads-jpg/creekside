  }

  /* ------------------------------------------------------------------ exports */
  function ordersText(rows) {
    const t = tally(rows);
    const out = [];
    out.push("DRESSED & FED: JIMMY JOHN'S ORDERS (THE GETTING-READY MENU)");
    out.push('Total orders: ' + rows.length);
    out.push('');
    out.push('SANDWICH TOTALS');
    t.sandwiches.forEach(s => out.push(`${s.num ? '#' + s.num + ' ' : ''}${s.label}: ${s.n}`));
    out.push('');
    out.push('ORDERS BY SANDWICH');
    t.sandwiches.forEach(s => {
      out.push('');
      out.push(`${s.num ? '#' + s.num + ' ' : ''}${s.label} (${s.n})`);
      sortRows(rows.filter(r => r.itemId === s.id), 'name-asc').forEach(r => {
        let line = `  - ${r.name}: ${r.bread}`;
        if (r.customizations && r.customizations.length) line += '; ' + r.customizations.join(', ');
        out.push(line);
        if (r.extrasList && r.extrasList.length) out.push('      Extras: ' + r.extrasList.join(', '));
        if (r.notes) out.push('      Note: ' + r.notes);
      });
    });
    if (t.extras.length) {
      out.push('');
      out.push('SIDES & DRINKS TOTALS');
      t.extras.forEach(([k, n]) => out.push(`${k}: ${n}`));
    }
    return out.join('\n');
  }
  function csvOf(rows) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const head = ['Guest Name', 'Sandwich #', 'Sandwich Name', 'Bread', 'Customizations', 'Extras', 'Special Instructions', 'Submitted Date/Time', 'Status'];
    const lines = [head.map(q).join(',')];
    sortRows(rows, 'name-asc').forEach(r => lines.push([r.name, r.num ? '#' + r.num : '', r.item, r.bread, (r.customizations || []).join('; ') || 'As is',
      (r.extrasList || []).join('; ') || 'None', r.notes || 'None', fmtTime(r.submittedAt), r.status].map(q).join(',')));
    return '﻿' + lines.join('\r\n');
  }
  async function copyText(text, okMsg) {
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (e) {
      showTextModal('Copy this text', 'Your browser blocked automatic copying. The text is selected below. Copy it with your device’s copy command.', text);
    }
  }
  function saveFile(filename, data) {
    const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/pdf';
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Downloaded ' + filename);
  }
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  async function exportPdf(rows) {
    try {
      if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(JSPDF_URL);
    } catch (e) { toast('Couldn’t load the PDF builder. Use Export Orders (CSV) instead.'); return; }
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
    const W = 792, H = 612, M = 36;
    const t = tally(rows);
    let y = M;
    doc.setFont('times', 'normal'); doc.setFontSize(20);
    doc.text('DRESSED & FED', W / 2, y + 8, { align: 'center' });
    doc.setFontSize(12); doc.setFont('times', 'italic');
    doc.text("Jimmy John's orders: " + rows.length + ' total, printed ' + fmtTime(new Date().toISOString()), W / 2, y + 26, { align: 'center' });
    y += 50;
    // summary columns
    const colW = (W - 2 * M - 30) / 3;
    const lists = [['SANDWICHES', t.sandwiches.map(s => [(s.num ? '#' + s.num + ' ' : '') + s.label, s.n])], ['CUSTOMIZATIONS', t.mods], ['SIDES & DRINKS', t.extras]];
    let maxY = y;
    lists.forEach(([title, items], i) => {
      const x = M + i * (colW + 15);
      let yy = y;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.text(title, x, yy); yy += 14;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
      (items.length ? items : [['None', '']]).forEach(([k, n]) => {
        const lines = doc.splitTextToSize(String(k), colW - 30);
        doc.text(lines, x, yy); doc.text(String(n), x + colW, yy, { align: 'right' });
        yy += lines.length * 11.5 + 2;
      });
      maxY = Math.max(maxY, yy);
    });
    // table
    const cols = [['Guest Name', 104], ['#', 26], ['Sandwich', 96], ['Bread', 92], ['Customizations', 146], ['Extras', 116], ['Special Instructions', 88], ['Status', 52]];
    const header = () => {
      doc.setFillColor(232, 236, 231); doc.rect(M, y - 10, W - 2 * M, 16, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
      let x = M + 4; cols.forEach(([h, w]) => { doc.text(h.toUpperCase(), x, y); x += w; });
      y += 14; doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    };
    y = maxY + 16;
    if (y > H - 120) { doc.addPage(); y = M + 10; }
    header();
    sortRows(rows, 'name-asc').forEach((r, i) => {
      const cells = [r.name, r.num ? '#' + r.num : '', r.item, r.bread, (r.customizations || []).join(', ') || 'As is', (r.extrasList || []).join(', ') || 'None', r.notes || 'None', r.status];
      const wrapped = cells.map((c, j) => doc.splitTextToSize(String(c), cols[j][1] - 8));
      const h = Math.max.apply(null, wrapped.map(l => l.length)) * 10.5 + 6;
      if (y + h > H - M) { doc.addPage(); y = M + 10; header(); }
      if (i % 2 === 1) { doc.setFillColor(246, 247, 244); doc.rect(M, y - 9, W - 2 * M, h, 'F'); }
      let x = M + 4;
      wrapped.forEach((l, j) => { doc.text(l, x, y); x += cols[j][1]; });
      y += h;
      doc.setDrawColor(220, 224, 218); doc.line(M, y - 9, W - M, y - 9);
    });
    saveFile('dressed-and-fed-orders.pdf', doc.output('blob'));
  }

  /* ------------------------------------------------------------------ copy & paste of a single order
   * A guest who can't save copies their order as readable text plus an order code.
   * The host pastes that text into "Paste an order"; the code restores it exactly.
   * Without a code (hand-typed or mangled), the labeled lines are matched to the menu. */
  function orderCopyText(d) {
    const desc = describe(d);
    if (!desc) return '';
    return [`Jimmy John's order for ${cleanName(d.name)}`, `Sandwich: ${(desc.num ? '#' + desc.num + ' ' : '') + desc.item}`, `Bread: ${desc.bread}`,
      `Customizations: ${desc.customizations.join(', ') || 'None'}`, `Extras: ${desc.extras.join(', ') || 'None'}`, `Special Instructions: ${desc.notes || 'None'}`,
      '', 'Order code (for the host): ' + encodeOrder(d)].join('\n');
  }
  function encodeOrder(d) {
    const json = JSON.stringify({ v: 1, n: cleanName(d.name), i: d.itemId, b: d.bread, t: d.toasted ? 1 : 0, m: d.mods, a: d.adds, x: d.extras, s: d.notes || '' });
    let bin = '';
    new TextEncoder().encode(json).forEach(c => { bin += String.fromCharCode(c); });
    return 'DF1.' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // Keep only values that exist on the menu, whatever the pasted text says.
  function cleanDraft(o) {
    const d = blankDraft();
    const it = ITEMS[o.itemId];
    d.name = cleanName(o.name).slice(0, 80);
    d.notes = String(o.notes || '').slice(0, 500);
    if (!it) return d;
    d.itemId = it.id;
    if (breadsFor(it) && SUB_BREADS.some(b => b.id === o.bread)) d.bread = o.bread;
    d.toasted = !!o.toasted && canToast(it, d);
    Object.keys(o.mods || {}).forEach(k => { if (it.ings.includes(k) && o.mods[k] !== 'regular' && modOptions(k).includes(o.mods[k])) d.mods[k] = o.mods[k]; });
    (o.adds || []).forEach(k => { if (ADDABLE.includes(k) && !it.ings.includes(k) && !d.adds.includes(k)) d.adds.push(k); });
    EXTRAS.forEach(g => { const v = (o.extras || {})[g.id]; if (g.options.some(x => x[0] === v)) d.extras[g.id] = v; });
    return d;
  }
  function decodeOrder(text) {
    const m = String(text).match(/DF1\.([A-Za-z0-9_-]+)/);
    if (!m) return null;
    try {
      let b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
      if (!o || !ITEMS[o.i]) return null;
      return cleanDraft({ name: o.n, itemId: o.i, bread: o.b, toasted: o.t, mods: o.m, adds: o.a, extras: o.x, notes: o.s });
    } catch (e) { return null; }
  }
  const normTxt = s => String(s || '').toLowerCase().replace(/[®™]/g, '').replace(/[^a-z0-9#&]+/g, ' ').trim();
  function parseOrderText(text) {
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const get = re => { for (const l of lines) { const m = l.match(re); if (m) return m[1].trim(); } return ''; };
    const problems = [];
    const o = { mods: {}, adds: [], extras: {} };
    o.name = get(/^(?:jimmy john'?s order for|name)\s*:?\s*(.+)$/i);
    const sw = get(/^sandwich\s*:\s*(.+)$/i);
    let it = null;
    const num = sw.match(/#\s*(\d+)/);
    if (num) it = Object.values(ITEMS).find(x => x.num === num[1]);
    if (!it && sw) {
      const want = normTxt(sw);
      it = Object.values(ITEMS).find(x => want.includes(normTxt(x.name).replace(/^the /, '')));
    }
    if (!it) return { draft: cleanDraft(o), problems };
    o.itemId = it.id;
    const bread = normTxt(get(/^bread\s*:\s*(.+)$/i));
    if (bread) {
      o.bread = /giant|16/.test(bread) ? 'french16' : /wheat/.test(bread) ? 'wheat' : /unwich|lettuce wrap/.test(bread) ? 'unwich' : 'french8';
      o.toasted = /toasted/.test(bread);
    }
    const ingByWord = word => Object.keys(ING).find(k => normTxt(ING[k].noun) === word || normTxt(ING[k].label) === word);
    get(/^customi[sz]ations?\s*:\s*(.+)$/i).split(/[,;]/).map(x => x.trim()).filter(x => x && !/^(none|as is)$/i.test(x)).forEach(part => {
      const m = part.match(/^(no|extra|add)\s+(.+)$/i);
      const k = m && ingByWord(normTxt(m[2]));
      const verb = m && m[1].toLowerCase();
      if (k && verb === 'add' && ADDABLE.includes(k) && !it.ings.includes(k)) o.adds.push(k);
      else if (k && verb !== 'add' && it.ings.includes(k) && modOptions(k).includes(verb === 'no' ? 'none' : 'extra')) o.mods[k] = verb === 'no' ? 'none' : 'extra';
      else problems.push(part);
    });
    get(/^extras?\s*:\s*(.+)$/i).split(/[,;]/).map(x => x.trim()).filter(x => x && !/^none$/i.test(x)).forEach(part => {
      const want = normTxt(part);
      let hit = null;
      EXTRAS.forEach(g => g.options.forEach(op => { if (!hit && (normTxt(op[2]) === want || normTxt(op[1]) === want)) hit = [g.id, op[0]]; }));
      if (hit) o.extras[hit[0]] = hit[1]; else problems.push(part);
    });
    const notes = get(/^special instructions\s*:\s*(.+)$/i);
    o.notes = /^none$/i.test(notes) ? '' : notes;
    if (problems.length) o.notes = (o.notes ? o.notes + ' ' : '') + '(Also asked for: ' + problems.join(', ') + ')';
    return { draft: cleanDraft(o), problems };
  }
  function pasteError(msg) {
    const er = $('#paste-err');
    if (er) { er.textContent = msg; er.hidden = false; }
    const ta = $('#paste-text');
    if (ta) ta.focus();
  }
  function fillFromPaste() {
    const el = $('#paste-text');
    const text = el ? el.value : '';
    if (!text.trim()) { pasteError('Paste the order text into the box first.'); return; }
    let draft = decodeOrder(text), problems = [];
    if (!draft) { const r = parseOrderText(text); draft = r.draft; problems = r.problems; }
    if (!draft.itemId) { pasteError('Couldn’t find a sandwich in that text. Check it has a line like “Sandwich: #2 Big John”.'); return; }
    S.view = 'flow'; S.target = null; S.returnTo = 'admin'; S.draft = draft; S.pasteInfo = { problems };
    goStep(cleanName(draft.name).length >= 2 ? 4 : 0);
  }

  /* ------------------------------------------------------------------ modal & toast */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }
  function showTextModal(title, msg, text) {
    $('#modal-root').innerHTML = `<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h3 id="m-title">${esc(title)}</h3><p class="hint">${esc(msg)}</p>
      <textarea class="textarea" id="m-text" readonly>${esc(text)}</textarea>
      <div class="btn-row"><button class="btn btn-secondary btn-sm" data-act="modal-close">Close</button></div></div></div>`;
    const ta = $('#m-text'); ta.focus(); ta.select();
  }
  let pendingConfirm = null;
  function confirmModal(title, msg, okLabel, fn) {
    pendingConfirm = fn;
    $('#modal-root').innerHTML = `<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h3 id="m-title">${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="btn-row"><button class="btn btn-secondary btn-sm" data-act="modal-close">Go back</button>
      <button class="btn btn-danger btn-sm" data-act="modal-ok">${esc(okLabel)}</button></div></div></div>`;
    $('[data-act="modal-ok"]').focus();
  }

  /* ------------------------------------------------------------------ actions */
  function goStep(n) {
    S.step = Math.max(0, Math.min(4, n));
    persistDraft();
    render();
    window.scrollTo(0, 0);
  }
  function next() {
    if (S.step === 0) {
      if (cleanName(S.draft.name).length < 2) { S.nameError = true; render(true); const el = $('#guest-name'); if (el) el.focus(); return; }
      S.nameError = false;
      S.draft.name = cleanName(S.draft.name);
    }
    if (S.step === 1 && !ITEMS[S.draft.itemId]) return;
    goStep(S.step + 1);
  }

  async function submit() {
    if (S.submitting) return;
    if (cleanName(S.draft.name).length < 2) { goStep(0); S.nameError = true; render(); return; }
    const desc = describe(S.draft);
    if (!desc) { goStep(1); return; }
    S.submitting = true; S.saveError = ''; renderBar();
    await ready;
    let id = S.target && S.target.entryId;
    const dup = duplicateOf(S.draft.name);
    if (!id && dup && S.myIds.includes(dup.id)) id = dup.id;   // same person again from this phone: replace
    // Keep an existing order's spelling when replacing it; tidy names typed all in lowercase.
    let name = cleanName(S.draft.name);
    if (dup && dup.id === id) name = dup.name;
    else if (name === name.toLowerCase()) name = name.replace(/(^|[\s-])(\S)/g, (m, sep, ch) => sep + ch.toUpperCase());
    const order = {
      name, itemId: S.draft.itemId, num: desc.num, item: desc.item, bread: desc.bread, breadKey: S.draft.bread, toasted: !!S.draft.toasted,
      mods: Object.assign({}, S.draft.mods), adds: S.draft.adds.slice(), extras: Object.assign({}, S.draft.extras),
      notes: desc.notes, customizations: desc.customizations, extrasList: desc.extras
    };
    try {
      const r = id ? await api('PUT', 'orders/' + id, { order, token: S.token }) : await api('POST', 'orders', { order, token: S.token });
      upsertOrder(r.order);
      if (S.returnTo !== 'admin') rememberMine(r.order.id, true);
      S.lastSaved = Object.assign({ wasUpdate: !!id }, r.order);
      S.pasteInfo = null;
      S.submitting = false;
      store.del(DRAFT_KEY);
      S.view = 'done'; S.target = null; S.draft = blankDraft(); S.step = 0;
      render(); window.scrollTo(0, 0);
      refresh();
    } catch (e) {
      S.submitting = false;
      if (e.error === 'duplicate') {
        S.saveError = e.message + (S.isOwner ? ' Edit that order from the dashboard instead, or use a different name.'
          : ' If it’s yours, open this page on the phone you ordered from, or ask the host to change it. If it’s someone else, add a last name or initial.');
      } else if (e.error === 'not_found' && id) {
        S.saveError = 'That order was removed. Tap Back and submit it as a new order.';
        S.target = null; rememberMine(id, false);
      } else S.saveError = e.message || 'Please try again.';
      render(true);
    }
  }

  function startEdit(entry, returnTo) {
    S.target = { entryId: entry.id };
    S.returnTo = returnTo || null;
    S.saveError = '';
    S.draft = Object.assign(blankDraft(), {
      name: entry.name, itemId: ITEMS[entry.itemId] ? entry.itemId : null, bread: entry.breadKey || 'french8', toasted: !!entry.toasted,
      mods: Object.assign({}, entry.mods || {}), adds: (entry.adds || []).slice(), extras: Object.assign({}, entry.extras || {}), notes: entry.notes || ''
    });
    S.view = 'flow';
    goStep(S.draft.itemId ? 4 : 1);
  }

  async function writeStatus(id, status) {
    const o = S.orders.find(x => x.id === id);
    if (!o) return;
    const before = { status: o.status, statusRev: o.statusRev };
    o.status = status; o.statusRev = o.rev || 1;
    renderAdminBody();
    try { const r = await api('PATCH', 'orders/' + id + '/status', { status }); upsertOrder(r.order); }
    catch (e) { Object.assign(o, before); toast(e.message || 'Couldn’t save that status. Try again.'); }
    renderAdminBody();
  }

  async function removeEntry(id) {
    try {
      await api('DELETE', 'orders/' + id, { token: S.token });
      S.orders = S.orders.filter(o => o.id !== id);
      rememberMine(id, false);
      toast('Order removed');
    } catch (e) {
      if (e.error === 'not_found') { S.orders = S.orders.filter(o => o.id !== id); rememberMine(id, false); }
      else toast(e.message || 'Couldn’t remove that order. Try again.');
    }
    onData();
    if (S.view === 'flow' && S.step === 0) render(true);
  }

  function findRow(key) { return adminRows().find(r => r.key === key); }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const d = S.draft;
    switch (act) {
      case 'next': next(); break;
      case 'back': goStep(S.step - 1); break;
      case 'goto': goStep(+el.dataset.step); break;
      case 'jump': { const t = document.getElementById('sec-' + el.dataset.sec); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); break; }
      case 'pick':
        if (d.itemId !== el.dataset.id) { d.itemId = el.dataset.id; d.mods = {}; d.adds = []; d.toasted = false; d.bread = 'french8'; }
        persistDraft(); render(true); break;
      case 'bread': d.bread = el.dataset.id; if (!canToast(ITEMS[d.itemId], d)) d.toasted = false; persistDraft(); render(true); break;
      case 'toast': d.toasted = el.dataset.val === '1'; persistDraft(); render(true); break;
      case 'mod': { const v = el.dataset.val; if (v === 'regular') delete d.mods[el.dataset.ing]; else d.mods[el.dataset.ing] = v; persistDraft(); render(true); break; }
      case 'add': { const id = el.dataset.ing, i = d.adds.indexOf(id); if (i >= 0) d.adds.splice(i, 1); else d.adds.push(id); persistDraft(); render(true); break; }
      case 'extra': { if (el.dataset.val) d.extras[el.dataset.grp] = el.dataset.val; else delete d.extras[el.dataset.grp]; persistDraft(); render(true); break; }
      case 'submit': submit(); break;
      case 'edit-mine': { const e = S.orders.find(o => o.id === el.dataset.id) || (S.lastSaved && S.lastSaved.id === el.dataset.id ? S.lastSaved : null); if (e) startEdit(e, null); break; }
      case 'cancel-mine': {
        const e = S.orders.find(o => o.id === el.dataset.id);
        if (e) confirmModal('Cancel this order?', `${e.name}'s order (${sandwichLabel(e)}) will be removed.`, 'Cancel order', () => removeEntry(e.id));
        break;
      }
      case 'go-login': ev.preventDefault(); S.view = S.isOwner ? 'admin' : 'login'; S.loginError = ''; render(); window.scrollTo(0, 0); break;
      case 'host-lock': hostLogout(); break;
      case 'print': window.print(); break;
      case 'go-home': S.saveError = ''; S.view = 'flow'; S.target = null; S.returnTo = null; S.draft = blankDraft(); goStep(0); refresh(); break;
      case 'new-order': S.saveError = ''; S.view = 'flow'; S.target = null; S.returnTo = null; S.draft = blankDraft(); goStep(0); break;
      case 'open-admin': S.view = S.isOwner ? 'admin' : 'login'; render(); window.scrollTo(0, 0); break;
      case 'close-admin': S.view = 'flow'; S.returnTo = null; if (location.hash) history.replaceState(null, '', location.pathname); goStep(0); break;
      case 'back-admin': S.view = 'admin'; S.returnTo = null; render(); window.scrollTo(0, 0); break;
      case 'host-add': S.pasteInfo = null; S.saveError = ''; S.view = 'flow'; S.target = null; S.returnTo = 'admin'; S.draft = blankDraft(); goStep(0); break;
      case 'paste-fill': fillFromPaste(); break;
      case 'cancel-host-entry': S.pasteInfo = null; S.view = 'admin'; S.returnTo = null; S.target = null; S.draft = blankDraft(); render(); window.scrollTo(0, 0); break;
      case 'status': {
        const r = findRow(el.dataset.key);
        if (r && r.status !== el.dataset.val) writeStatus(r.id, el.dataset.val);
        break;
      }
      case 'admin-edit': { const r = findRow(el.dataset.key); if (r) startEdit(r, 'admin'); break; }
      case 'admin-del': {
        const r = findRow(el.dataset.key);
        if (r) confirmModal('Remove this order?', `${r.name}'s order (${sandwichLabel(r)}) will be deleted. This can't be undone.`, 'Remove order', () => removeEntry(r.id));
        break;
      }
      case 'copy-all': copyText(ordersText(adminRows()), 'All orders copied'); break;
      case 'export-csv': { const rows = adminRows(); saveFile('dressed-and-fed-orders.csv', csvOf(rows)); break; }
      case 'export-pdf': exportPdf(adminRows()); break;
      case 'modal-ok': { const fn = pendingConfirm; pendingConfirm = null; closeModal(); if (fn) fn(); break; }
      case 'modal-close': pendingConfirm = null; closeModal(); break;
      case 'modal-bg': if (ev.target === el) { pendingConfirm = null; closeModal(); } break;
    }
  });

  document.addEventListener('submit', ev => {
    if (ev.target.id === 'login-form') {
      ev.preventDefault();
      const v = ($('#host-pass') || {}).value || '';
      if (v.trim()) hostLogin(v.trim());
    }
  });
  window.addEventListener('hashchange', () => {
    if (location.hash === '#host') { S.view = S.isOwner ? 'admin' : 'login'; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'guest-name') { S.draft.name = t.value; if (S.nameError && cleanName(t.value).length >= 2) { S.nameError = false; const er = $('#name-err'); if (er) er.remove(); t.removeAttribute('aria-invalid'); } persistDraft(); }
    else if (t.id === 'notes') { S.draft.notes = t.value; persistDraft(); }
    else if (t.id === 'admin-search') { S.admin.search = t.value; S._refocusSearch = true; renderDash(); }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'admin-filter') { S.admin.filter = t.value; renderDash(); }
    else if (t.id === 'admin-sort') { S.admin.sort = t.value; renderDash(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.id === 'guest-name') { ev.preventDefault(); next(); }
    if (ev.key === 'Escape' && $('#modal-root').firstChild) { pendingConfirm = null; closeModal(); }
  });

  render();
})();
</script>
</body>
</html>
